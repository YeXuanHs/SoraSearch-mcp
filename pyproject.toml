[project]
name = "SoraSearch-mcp"
version = "0.2.0"
description = "From-scratch Bing + Baidu SERP scrapers (title/URL/snippet) with verified paging, exposed as an MCP server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "curl_cffi>=0.5",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "playwright>=1.40",
]

[project.scripts]
SoraSearch-mcp = "sora_search.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sora_search*"]
